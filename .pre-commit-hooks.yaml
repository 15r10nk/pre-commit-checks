- id: check-changelog
  name: Check branch changelog fragment
  description: Require a new Scriv fragment for feat and fix commits on a branch.
  entry: check-changelog
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-push, manual]

- id: check-tracked-ignored
  name: Check tracked files against .gitignore
  description: Reject tracked files matched by repository .gitignore rules.
  entry: check-tracked-ignored
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-push, manual]

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.14']
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: ${{matrix.python-version}}
    - run: python -m pip install . pre-commit
    - run: python -m unittest discover -s tests
    - run: pre-commit validate-manifest .pre-commit-hooks.yaml

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
    - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
      with:
        prek-version: 0.5.10
    - name: Check PR changelog
      if: github.event_name == 'pull_request'
      env:
        PRE_COMMIT_FROM_REF: ${{github.event.pull_request.base.sha}}
        PRE_COMMIT_TO_REF: ${{github.event.pull_request.head.sha}}
      run: prek run check-changelog --stage manual
